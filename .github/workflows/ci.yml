name: CI

on:
    push:
    pull_request:
    release:
        types:
            - published

jobs:
    php-tests:
        runs-on: ubuntu-latest

        services:
            redis:
                image: redis:8
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12.*', '13.*']
                coverage: [none]
                include:
                    - laravel: '12.*'
                      testbench: '^10.0'
                    - laravel: '13.*'
                      testbench: '^11.0'
                    - php: '8.4'
                      laravel: '13.*'
                      testbench: '^11.0'
                      coverage: xdebug

        # The ruleset requires these exact names, e.g. "[P8.4] [L12.*] [none]".
        name: '[P${{ matrix.php }}] [L${{ matrix.laravel }}] [${{ matrix.coverage }}]'

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, redis
                  ini-values: memory_limit=-1
                  tools: composer:v2
                  coverage: ${{ matrix.coverage }}

            - name: Pin Laravel ${{ matrix.laravel }} and Testbench ${{ matrix.testbench }}
              run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

            - name: Install Dependencies
              uses: ramsey/composer-install@v4

            - name: Verify installed versions
              run: |
                  composer show laravel/framework | grep -E '^versions'
                  composer show orchestra/testbench | grep -E '^versions'
                  composer show predis/predis | grep -E '^versions'
                  php -r 'echo "phpredis ", phpversion("redis"), PHP_EOL;'
                  installed=$(composer show laravel/framework --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')
                  case "$installed" in
                      v${{ matrix.laravel }}) echo "Laravel $installed matches ${{ matrix.laravel }}" ;;
                      *) echo "::error::Installed Laravel $installed does not match ${{ matrix.laravel }}"; exit 1 ;;
                  esac

            - name: Tests (phpredis)
              if: matrix.coverage == 'none'
              run: composer test
              env:
                  REDIS_CLIENT: phpredis

            - name: Tests (predis)
              if: matrix.coverage == 'none'
              run: composer test
              env:
                  REDIS_CLIENT: predis

            - name: Tests with coverage
              if: matrix.coverage == 'xdebug'
              run: composer test-ci

            - name: Upload coverage reports to Codecov
              if: matrix.coverage == 'xdebug'
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: ${{ github.repository }}

            - name: Upload test results to Codecov
              if: matrix.coverage == 'xdebug'
              uses: codecov/test-results-action@v1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  slug: ${{ github.repository }}

    code-style:
        name: Code style (Pint)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: redis
                  coverage: none
                  tools: composer:v2
            - uses: ramsey/composer-install@v4
            - run: composer check

    static-analysis:
        name: Static analysis (PHPStan)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: redis
                  coverage: none
                  tools: composer:v2
            - uses: ramsey/composer-install@v4
            - run: composer analyze
